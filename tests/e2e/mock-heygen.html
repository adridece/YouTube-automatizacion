<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>HeyGen (SIMULADO para pruebas)</title>
<!--
  Imitación MÍNIMA de la página de HeyGen del usuario (create-v4, panel de voz), con la estructura de los
  selectores que dio (sin las clases css-xxxx). SIM: al pulsar reproducir, la página pide el audio a
  /tts/<id>.mp3 y lo reproduce con un <audio> (lo que en DevTools sale como "Media").
  El audio pesa 200000 + nº de caracteres del guion: así la prueba comprueba que es el del texto nuevo.
-->
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; background: #111; color: #ddd; }
  .te-scriptpanel-redesign { padding: 12px; border: 1px solid #333; margin: 12px; }
  [contenteditable] { min-height: 80px; background: #1b1b1b; padding: 8px; }
  .tw-h-\[168px\] { height: 168px; border: 1px solid #333; margin: 12px; }
  .play { width: 32px; height: 32px; background: #e8234b; border-radius: 50%; cursor: pointer; }
</style>
</head>
<body>
<div id="root">
  <div class="te-scriptpanel-redesign">
    <div>Guion</div>
    <div><div><div contenteditable="true" id="script"><p>Texto viejo que había antes en el guion.</p></div></div></div>
  </div>
  <div class="tw-h-[168px]">
    <div class="tw-flex tw-w-full tw-flex-row tw-items-center tw-justify-between tw-border-b tw-border-line tw-pb-2">
      <div class="tw-relative tw-flex tw-flex-row tw-items-center tw-gap-3">
        <div><div><button class="play" id="play" aria-label=""></button></div></div>
        <div>Voz: Mi voz</div>
      </div>
    </div>
  </div>
</div>
<script>
const P = new URLSearchParams(location.search);
// SIM (prueba real v2.9.1): HeyGen muestra el guion con SU formato (comillas
// tipográficas, espacios duros…), así que el texto no es idéntico al pegado.
const ed = document.getElementById("script");
// Como HeyGen real: el guion se guarda en el proyecto (sobrevive a recargar).
if (sessionStorage.getItem("hgScript")) ed.innerHTML = sessionStorage.getItem("hgScript");
new MutationObserver(() => sessionStorage.setItem("hgScript", ed.innerHTML)).observe(ed, { childList: true, subtree: true, characterData: true });
let fmtT = null;
ed.addEventListener("input", () => {
  // writeBroken=1: el guion no acepta el texto nuevo (vuelve al viejo).
  if (P.get("writeBroken")) { setTimeout(() => { ed.innerHTML = "<p>Texto viejo que había antes en el guion.</p>"; }, 50); return; }
  clearTimeout(fmtT);
  fmtT = setTimeout(() => {
    const txt = ed.innerText;
    const f = txt.replace(/"([^"]*)"/g, "“$1”").replace(/¿/g, "¿\u00a0");
    if (f !== txt) ed.innerHTML = f.split(/\n+/).map((l) => `<p>${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</p>`).join("");
  }, 300);
});
// SIM de la red real (captura del usuario, 29 sep 2026): al pulsar reproducir
// salen appear_v1.webm y disappear_v1.webm (animaciones de la interfaz) y,
// cuando HeyGen termina, la VOZ: "…?id=<uuid>" en otro dominio, 206 (rango).
const uuid = () => "98f62577-89f0-49" + Math.random().toString(16).slice(2, 14);
function uiAnim(name) { const v = document.createElement("video"); v.muted = true; v.src = `/ui/${name}`; document.body.appendChild(v); v.play().catch(() => {}); }
function playVoice(id, chars) {
  const a = document.createElement("audio");
  a.src = `https://resource2.heygen.ai/v1/voice?id=${id}&chars=${chars}`;
  document.body.appendChild(a);
  a.play().catch(() => {});
}
let playing = null; // { id, chars } mientras "suena"
document.getElementById("play").addEventListener("click", async () => {
  if (playing) {
    // Segundo clic = PARAR (no es otra previsualización).
    sessionStorage.setItem("hgPauses", String(+(sessionStorage.getItem("hgPauses") || 0) + 1));
    const v = playing;
    playing = null;
    // audioOnPause=1 (como el HeyGen del usuario): la voz sale en la red al parar.
    if (P.get("audioOnPause")) playVoice(v.id, v.chars);
    return;
  }
  // needsFrames=1: como muchas webs, no hace nada hasta el siguiente fotograma
  // (requestAnimationFrame): con la pestaña oculta y sin preparar, nunca llega.
  if (P.get("needsFrames")) await new Promise((r) => requestAnimationFrame(r));
  const text = document.getElementById("script").innerText.replace(/\s+/g, " ").trim();
  sessionStorage.setItem("hgPlayed", String(+(sessionStorage.getItem("hgPlayed") || 0) + 1));
  sessionStorage.setItem("hgText", text);
  uiAnim("appear_v1.webm");
  const id = uuid();
  sessionStorage.setItem("hgVoice", JSON.stringify({ id, chars: text.length }));
  await new Promise((r) => setTimeout(r, +(P.get("ttsMs") || 1500))); // SIM: HeyGen genera la voz
  uiAnim("disappear_v1.webm");
  playing = { id, chars: text.length };
  // audioOnReload=1: la voz no sale en la red hasta que se recarga la página;
  // audioOnPause=1: solo sale al pulsar otra vez (parar).
  if (!P.get("audioOnReload") && !P.get("audioOnPause")) playVoice(id, text.length);
});
// Al recargar, HeyGen carga la última voz generada (lo que contó el usuario).
if (P.get("audioOnReload") && sessionStorage.getItem("hgVoice")) {
  const v = JSON.parse(sessionStorage.getItem("hgVoice"));
  setTimeout(() => playVoice(v.id, v.chars), 800);
}
</script>
</body>
</html>
